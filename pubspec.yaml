name: FiliSign
description: "hand gesture sign language powered by tensorflow"
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI & UX
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # ML & Media
  camera: ^0.11.0+2
  tflite_flutter: ^0.12.1
  path_provider: ^2.1.2
  path: ^1.9.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/signs/
